name: Contest reminders

on:
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Send an immediate test email (leave empty for the normal run)'
        required: false
        default: ''

jobs:
  send:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reminders
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Send due reminders
        if: ${{ inputs.test_email == '' }}
        run: node send.js
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Send test email
        if: ${{ inputs.test_email != '' }}
        run: node send.js --test
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST_EMAIL: ${{ inputs.test_email }}
